<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDRA Cyclone Detector</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{
      background:#081b33;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }
    .card{
      width:100%;
      max-width:650px;
      background:#102746;
      border-radius:20px;
      padding:30px;
      text-align:center;
      box-shadow:0 0 25px rgba(0,0,0,.35);
    }
    h1{margin-bottom:10px;color:#5cc8ff}
    p{color:#d5e6f8;margin-bottom:25px}
    input[type=file]{
      width:100%;
      padding:14px;
      background:#17365d;
      border:2px dashed #5cc8ff;
      border-radius:12px;
      color:white;
      margin-bottom:20px;
    }
    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#00b4ff;
      color:white;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }
    button:hover{background:#008fd1}
    img{
      width:100%;
      margin-top:20px;
      border-radius:15px;
      display:none;
    }
    .result{
      margin-top:25px;
      background:#17365d;
      padding:20px;
      border-radius:15px;
      display:none;
    }
    .label{color:#8cc8ff;font-size:14px}
    .value{font-size:22px;font-weight:bold;margin-bottom:12px}
    .loading{display:none;margin-top:15px;color:#ffdb70}
  </style>
</head>
<body>

<div class="card">
  <h1>🌪 INDRA Cyclone Detector</h1>
  <p>Upload a satellite cyclone image to predict its cyclone category.</p>

  <input id="imageInput" type="file" accept="image/*">

  <button onclick="predictCyclone()">Predict Cyclone</button>

  <div class="loading" id="loading">⏳ Analysing image...</div>

  <img id="preview">

  <div class="result" id="resultBox">
    <div class="label">Prediction</div>
    <div class="value" id="prediction">-</div>

    <div class="label">Confidence</div>
    <div class="value" id="confidence">-</div>
  </div>
</div>

<script>
const imageInput=document.getElementById('imageInput');
const preview=document.getElementById('preview');

imageInput.addEventListener('change',()=>{
    const file=imageInput.files[0];
    if(file){
        preview.src=URL.createObjectURL(file);
        preview.style.display='block';
    }
});

async function predictCyclone(){
    const file=imageInput.files[0];

    if(!file){
        alert('Please select an image first.');
        return;
    }

    const formData=new FormData();
    formData.append('file',file);

    document.getElementById('loading').style.display='block';
    document.getElementById('resultBox').style.display='none';

    try{
        const response=await fetch('/predict',{
            method:'POST',
            body:formData
        });

        const data=await response.json();

        document.getElementById('loading').style.display='none';

        if(data.error){
            alert(data.error);
            return;
        }

        document.getElementById('prediction').textContent=data.prediction;
        document.getElementById('confidence').textContent=(data.confidence*100).toFixed(2)+'%';
        document.getElementById('resultBox').style.display='block';

    }catch(err){
        document.getElementById('loading').style.display='none';
        alert('Cannot connect to the prediction server.');
        console.error(err);
    }
}
</script>

</body>
</html>
